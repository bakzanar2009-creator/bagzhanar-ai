
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAGZHANAR AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:20px;background:#191a20;border-bottom:1px solid #30313a;font-size:22px;font-weight:bold}
header span{color:#8b8cff}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{padding:13px 15px;border-radius:17px;max-width:88%;white-space:pre-wrap;line-height:1.5}
.user{background:#4143a6;align-self:flex-end}
.ai{background:#22242b;align-self:flex-start}
#starter{text-align:center;margin:auto;color:#b8bac7;line-height:1.8}
#starter strong{font-size:28px;color:white}
footer{padding:12px;background:#191a20;display:flex;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;border:1px solid #41424c;background:#262830;color:white;border-radius:14px;padding:13px;font-size:16px;max-height:120px;outline:none}
button{border:0;border-radius:13px;background:#7778ff;color:white;padding:0 17px;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header><span>✦</span> BAGZHANAR AI</header>
<div id="chat">
<div id="starter"><strong>BAGZHANAR AI</strong><br>Сәлем! Саған қалай көмектесе аламын?</div>
</div>
<footer>
<textarea id="input" rows="1" placeholder="Хабарлама жаз..."></textarea>
<button id="send">➤</button>
</footer>
<script>
const API="https://bagzhanar-ai.onrender.com/api/chat";
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
let history=[];
function add(text,who){
const starter=document.getElementById("starter");
if(starter)starter.remove();
const div=document.createElement("div");
div.className="msg "+who;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return div;
}
async function ask(){
const text=input.value.trim();
if(!text||send.disabled)return;
input.value="";
add(text,"user");
history.push({role:"user",content:text});
send.disabled=true;
const reply=add("Жауап дайындалып жатыр...","ai");
try{
const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
const data=await r.json();
if(!r.ok)throw new Error(data.error||"Сервер қатесі: "+r.status);
const answer=data.reply||data.message||data.choices?.[0]?.message?.content||"Жауап алынбады.";
reply.textContent=answer;
history.push({role:"assistant",content:answer});
}catch(e){reply.textContent="Қате: "+e.message+"\nRender серверін және OPENAI_API_KEY баптауын тексер."}
finally{send.disabled=false;input.focus()}
}
send.addEventListener("click",ask);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
</script>
</body>
</html>
