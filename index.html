<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>BAGZHANAR AI</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a1f;--panel2:#22242a;--text:#f5f6f8;--muted:#a5a8b2;--line:#30323a;--blue:#78a9ff;--green:#b6f09c}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;min-height:100dvh}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(16,17,20,.96);position:sticky;top:0;z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.2px}.logo{height:34px;width:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#fff,#b7d2ff);color:#11131a;font-size:14px;font-weight:900;box-shadow:0 0 22px #6597ff22}
.head-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);height:38px;width:38px;border-radius:13px;font-size:18px;display:grid;place-items:center}
main{flex:1;display:flex;flex-direction:column;max-width:850px;width:100%;margin:0 auto;padding:16px 14px 12px;min-height:0}
#messages{flex:1;overflow:auto;padding:8px 0 22px;scroll-behavior:smooth}
.welcome{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 8px}
.hero-logo{width:68px;height:68px;border-radius:23px;display:grid;place-items:center;background:linear-gradient(140deg,#f8fbff,#9fc4ff);color:#101114;font-weight:900;font-size:23px;margin-bottom:22px;box-shadow:0 12px 40px #649cff20}
h1{font-size:28px;line-height:1.18;margin:0 0 12px;letter-spacing:-.7px}.welcome p{color:var(--muted);margin:0 0 28px;font-size:15px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.suggestion{border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:14px;text-align:left;color:var(--text);font-size:14px;min-height:68px}
.suggestion span{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.msg{display:flex;gap:10px;margin:18px 0;align-items:flex-start}.avatar{width:30px;height:30px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;background:#dce8ff;color:#151820}.msg.user .avatar{background:#2b2d34;color:#f5f6f8}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:15px;padding:3px 0;max-width:100%}.msg.user .bubble{background:var(--panel2);padding:12px 14px;border-radius:18px;border-top-right-radius:6px}.msg .tools{display:flex;gap:12px;margin-top:9px}.tiny{background:none;border:0;color:var(--muted);padding:2px 0;font-size:12px}
.typing{color:var(--muted);font-size:14px;padding:10px 0}
.composer-wrap{position:sticky;bottom:0;padding:8px 0 max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 20%)}
.composer{background:var(--panel);border:1px solid #3b3e47;border-radius:25px;padding:10px 10px 10px 16px;box-shadow:0 8px 35px #0003}
textarea{display:block;width:100%;resize:none;max-height:150px;min-height:34px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.45;padding:6px 0}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.hint{font-size:11px;color:#818590}.send{width:40px;height:40px;border:0;border-radius:15px;background:#f3f5f9;color:#14161b;font-size:19px;font-weight:800}.send:disabled{opacity:.45}
.notice{text-align:center;color:#777b86;font-size:10px;line-height:1.4;padding:7px 16px 2px}
#toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:#2a2d35;color:#fff;border:1px solid #444752;border-radius:12px;padding:10px 14px;font-size:13px;display:none;z-index:10;max-width:90vw}
@media(min-width:650px){main{padding:20px 24px}.welcome{min-height:58vh}h1{font-size:34px}.composer-wrap{padding-bottom:16px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">BA</div><span>BAGZHANAR AI</span></div>
  <div class="head-actions">
    <button class="iconbtn" id="newChat" aria-label="Жаңа чат" title="Жаңа чат">＋</button>
    <button class="iconbtn" id="historyBtn" aria-label="Тарих" title="Чат тарихы">◷</button>
  </div>
</header>
<main>
  <section id="messages" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="hero-logo">BA</div>
      <h1>Сәлем! 👋<br>Бүгін саған қалай көмектесейін?</h1>
      <p>Сенің ақылды AI көмекшің.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Мына есепті қадам-қадамымен түсіндіріп бер: ">📚 Үй тапсырмасы<span>Есепті түсініп шығар</span></button>
        <button class="suggestion" data-prompt="Мына тақырыпқа мәтін жазып бер: ">✍️ Мәтін жазу<span>Ойыңды мәтінге айналдыр</span></button>
        <button class="suggestion" data-prompt="Мына мәтінді қазақшаға аудар: ">🌐 Аударма<span>Тілдер арасында аудар</span></button>
        <button class="suggestion" data-prompt="Маған осы тақырып бойынша 5 сұрақтық тест құрастыр: ">🧠 Тест құру<span>Біліміңді тексер</span></button>
      </div>
    </div>
  </section>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="BAGZHANAR AI-ға сұрақ қой..." aria-label="Хабарлама"></textarea>
      <div class="composer-bottom"><span class="hint">Enter — жіберу · Shift+Enter — жаңа жол</span><button class="send" id="send" aria-label="Жіберу">↑</button></div>
    </div>
    <div class="notice">BAGZHANAR AI кейде қателесуі мүмкін. Маңызды ақпаратты тексеріп ал.</div>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
/*
  BACKEND_URL-ді өз серверіңіздің HTTPS мекенжайына ауыстырыңыз.
  API кілтін бұл файлға ЕШҚАШАН жазбаңыз.
*/
const BACKEND_URL = "https://YOUR-BACKEND-DOMAIN.example.com";
const STORAGE_KEY = "bagzhanar_ai_chats_v1";
let chats = loadChats(), activeId = null, busy = false;
const messagesEl = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
function loadChats(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch{return []}}
function saveChats(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(chats))}catch{toast("Жергілікті сақтау мүмкін болмады.")}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",2800)}
function currentChat(){return chats.find(c=>c.id===activeId)}
function newChat(){activeId=null;render()}
function render(){
  messagesEl.innerHTML="";
  const chat=currentChat();
  if(!chat||!chat.messages.length){
    messagesEl.innerHTML=document.getElementById("welcome").outerHTML;
    messagesEl.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus();resizeInput()});
    return;
  }
  chat.messages.forEach((m,i)=>{
    const row=document.createElement("div");row.className="msg "+(m.role==="user"?"user":"assistant");
    const av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"СЕН":"BA";
    const content=document.createElement("div");content.style.minWidth="0";content.style.flex="1";
    const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content;content.appendChild(bubble);
    if(m.role==="assistant"){
      const tools=document.createElement("div");tools.className="tools";
      const copy=document.createElement("button");copy.className="tiny";copy.textContent="Көшіру";copy.onclick=()=>navigator.clipboard?.writeText(m.content).then(()=>toast("Көшірілді")).catch(()=>toast("Көшіру мүмкін болмады"));
      const share=document.createElement("button");share.className="tiny";share.textContent="Бөлісу";share.onclick=async()=>{try{if(navigator.share)await navigator.share({text:m.content});else{await navigator.clipboard.writeText(m.content);toast("Мәтін көшірілді")}}catch{}};
      tools.append(copy,share);content.appendChild(tools);
    }
    row.append(av,content);messagesEl.appendChild(row);
  });
  messagesEl.scrollTop=messagesEl.scrollHeight;
}
function resizeInput(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"}
input.addEventListener("input",resizeInput);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
sendBtn.onclick=sendMessage;
document.getElementById("newChat").onclick=newChat;
document.getElementById("historyBtn").onclick=()=>{
 if(!chats.length){toast("Әзірге чат тарихы жоқ.");return}
 const list=chats.map((c,i)=>(i+1)+". "+c.title).join("\n");
 const choice=prompt("Чат тарихы:\n"+list+"\n\nАшу үшін нөмірін енгіз. Жою үшін нөмірдің алдына - қой.");
 if(!choice)return;const n=parseInt(choice,10);
 if(Number.isNaN(n)||n===0||Math.abs(n)>chats.length){toast("Нөмір дұрыс емес.");return}
 if(n<0){if(confirm("Осы чатты өшірейін бе?")){const c=chats.splice(Math.abs(n)-1,1)[0];if(c.id===activeId)activeId=null;saveChats();render()}return}
 activeId=chats[n-1].id;render();
};
async function sendMessage(){
 const text=input.value.trim();if(!text||busy)return;
 if(BACKEND_URL.includes("YOUR-BACKEND-DOMAIN")){toast("Алдымен backend серверінің мекенжайын index.html ішіне енгізу керек.");return}
 let chat=currentChat();
 if(!chat){chat={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:text.slice(0,42),messages:[],updatedAt:Date.now()};chats.unshift(chat);activeId=chat.id}
 chat.messages.push({role:"user",content:text});chat.updatedAt=Date.now();input.value="";resizeInput();saveChats();render();
 busy=true;sendBtn.disabled=true;
 const typing=document.createElement("div");typing.className="typing";typing.textContent="BAGZHANAR AI ойланып жатыр...";messagesEl.appendChild(typing);messagesEl.scrollTop=messagesEl.scrollHeight;
 try{
   const response=await fetch(BACKEND_URL.replace(/\/$/,"")+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chat.messages.map(m=>({role:m.role,content:m.content}))})});
   if(!response.ok){let msg="Бір нәрсе дұрыс болмады 😕";try{const d=await response.json();if(d.error==="RATE_LIMIT")msg="Бүгінгі тегін сұрау лимиті аяқталды."}catch{}throw new Error(msg)}
   const data=await response.json();
   if(!data.reply)throw new Error("Бір нәрсе дұрыс болмады 😕");
   chat.messages.push({role:"assistant",content:data.reply});chat.updatedAt=Date.now();saveChats();
 }catch(err){if(err instanceof TypeError)toast("Интернет байланысы жоқ.");else toast(err.message||"Бір нәрсе дұрыс болмады 😕")}
 finally{busy=false;sendBtn.disabled=false;render()}
}
render();
</script>
</body>
</html>
